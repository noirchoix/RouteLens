services:
  reacts-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      REACTS_ARTIFACT_REQUIRED: "true"
      REACTS_ARTIFACT_CACHE_DIR: /var/lib/reacts/artifacts
    volumes:
      - reacts-artifacts:/var/lib/reacts/artifacts
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  reacts-artifacts:
