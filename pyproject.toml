[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reacts-contextual-intelligence"
version = "2.1.3"
description = "Enterprise-grade contextual USPTO reaction curation, structural mapping, ML governance, retrieval and inference platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "REACTS Project"}]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pandas>=2.2",
  "numpy==2.5.1",
  "scipy==1.18.0",
  "scikit-learn==1.9.0",
  "joblib==1.5.3",
  "rdkit==2026.3.4",
  "pyarrow>=16.0",
  "prometheus-client>=0.20",
  "psutil>=6.0",
  "packaging>=24.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10"]
ml = ["lightgbm>=4.5", "xgboost>=2.1", "mlflow>=2.15"]
mapping = ["rxnmapper==0.4.3", "setuptools==81.0.0"]

[project.scripts]
reacts = "reacts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reacts = ["ui/static/*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
